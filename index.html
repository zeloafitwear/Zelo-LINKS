<style>
:root{
  --bg:#0C0C0C;
  --ink:#F2F2F2;
  --muted:#8E8E8E;
  --line:rgba(242,242,242,.26);
  --sans:'Montserrat','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;display:flex;justify-content:center}
.page{
  width:100%;max-width:420px;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:clamp(56px,11vh,104px) 28px 32px;
}
.brand{display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{display:block;width:112px;height:auto}
.name{margin-top:30px;font-size:.66rem;letter-spacing:.5em;padding-left:.5em;font-weight:400;color:var(--muted)}
.rule{width:24px;height:1px;background:var(--ink);opacity:.7;margin:30px 0 28px}
.tagline{font-weight:300;font-size:1.5rem;line-height:1.2;letter-spacing:.04em}
.sub{margin-top:10px;font-size:.78rem;letter-spacing:.12em;color:var(--muted);font-weight:300}
.actions{width:100%;margin-top:clamp(44px,8vh,72px);display:flex;flex-direction:column;gap:14px}
.btn{
  position:relative;display:flex;align-items:center;justify-content:center;gap:12px;
  min-height:54px;padding:0 24px;color:var(--ink);text-decoration:none;
  border:1px solid var(--line);border-radius:2px;
  font-size:.7rem;letter-spacing:.34em;font-weight:500;
  overflow:hidden;isolation:isolate;
  transition:border-color .45s ease,color .45s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--ink);transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.btn svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.btn span{padding-left:.34em}
@media (hover:hover){.btn:hover{color:var(--bg);border-color:var(--ink)}.btn:hover::before{transform:scaleY(1)}}
.btn:active{color:var(--bg);border-color:var(--ink)}
.btn:active::before{transform:scaleY(1)}
.btn:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
footer{margin-top:auto;padding-top:56px;text-align:center}
.f-name{font-size:.58rem;letter-spacing:.5em;padding-left:.5em;font-weight:400;color:var(--muted)}
.f-line{margin-top:8px;font-size:.68rem;letter-spacing:.1em;color:var(--muted);opacity:.75}
.reveal{opacity:0;transform:translateY(8px);animation:in .9s cubic-bezier(.2,.7,.2,1) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.25s}.d3{animation-delay:.45s}.d4{animation-delay:.65s}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}.btn,.btn::before{transition:none}}
@media (min-width:700px){.page{padding-top:112px}}
</style>
</head>
